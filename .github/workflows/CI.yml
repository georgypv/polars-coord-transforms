# Originally generated by maturin; artifact handling is maintained here.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, x86, aarch64, armv7, ppc64le]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Build wheels
        if: matrix.target != 'x86'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i 3.10
          sccache: 'true'
          manylinux: auto
      - name: Check x86 container networking and threads
        if: matrix.target == 'x86'
        id: x86-container
        shell: bash
        run: |
          docker pull quay.io/pypa/manylinux_2_34_i686:latest
          check_container() {
            docker run --rm "$@" quay.io/pypa/manylinux_2_34_i686:latest bash -c '
              set -e
              /opt/python/cp311-cp311/bin/python -c "import threading; t = threading.Thread(target=lambda: None); t.start(); t.join()"
              curl -fsSL -o /dev/null https://sh.rustup.rs
            '
          }
          if check_container; then
            echo 'docker-options=' >> "$GITHUB_OUTPUT"
          elif check_container --security-opt seccomp=unconfined; then
            echo '::warning::The x86 container requires Docker seccomp to be disabled for thread creation or DNS.'
            echo 'docker-options=--security-opt seccomp=unconfined' >> "$GITHUB_OUTPUT"
          else
            echo '::error::The x86 container could not start a thread or reach the Rust installer, even without Docker seccomp.'
            exit 1
          fi
      - name: Build x86 wheels
        if: matrix.target == 'x86'
        uses: PyO3/maturin-action@v1
        env:
          CARGO_BUILD_TARGET: i686-unknown-linux-gnu
        with:
          # This image already has libatomic; omitting the action's target input
          # avoids its redundant yum install against the AlmaLinux vault.
          container: quay.io/pypa/manylinux_2_34_i686:latest
          docker-options: ${{ steps.x86-container.outputs.docker-options }}
          manylinux: '2_34'
          args: --release --out dist -i 3.10
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i 3.10
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i 3.10
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Pyodide build tools
        run: python -m pip install 'pyodide-build==0.25.1' 'wheel==0.45.1'
      - name: Get Emscripten version
        id: pyodide-config
        shell: bash
        run: |
          version=$(pyodide config get emscripten_version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "emscripten-version=$version" >> "$GITHUB_OUTPUT"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.pyodide-config.outputs.emscripten-version }}
          actions-cache-folder: emsdk-cache
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: wasm32-unknown-emscripten
          args: --release --out dist -i 3.11
          sccache: 'true'
          # Match Emscripten 3.1.46's WebAssembly feature support.
          rust-toolchain: nightly-2024-10-20
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wasm-wheels
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, emscripten, sdist]
    permissions:
      # Used to upload release artifacts
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*
      - uses: actions/download-artifact@v4
        with:
          name: wasm-wheels
          path: wasm
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wasm/*.whl
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
